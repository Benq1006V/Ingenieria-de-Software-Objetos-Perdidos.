<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OBJETOS PERDIDOS - Registro Objeto Encontrado</title>

<style>
    body{
        margin:0;
        font-family:Arial, Helvetica, sans-serif;
        background:#f4f5ff;
    }

    header{
        background:#001E62;
        padding:18px;
        color:white;
        text-align:center;
        font-size:22px;
        font-weight:bold;
    }

    .container{
        width:90%;
        max-width:600px;
        background:white;
        margin:30px auto;
        padding:25px;
        border-radius:15px;
        border:2px solid #001E62;
        box-shadow:0px 0px 8px rgba(0,0,0,0.2);
    }

    label{
        font-weight:bold;
        color:#001E62;
    }

    input,select,textarea{
        width:100%;
        padding:10px;
        margin-top:6px;
        margin-bottom:15px;
        border-radius:10px;
        border:1.5px solid #001E62;
        font-size:15px;
    }

    button{
        width:100%;
        background:#FFCE00;
        border:none;
        font-size:18px;
        font-weight:bold;
        padding:14px;
        border-radius:10px;
        cursor:pointer;
    }

    button:hover{
        background:#f2c200;
    }

    .msg{
        text-align:center;
        color:green;
        font-weight:bold;
        margin-top:10px;
    }
</style>

</head>

<body>

<header>
    Registro Objeto Encontrado
</header>

<div class="container">
    <label>Nombre del objeto *</label>
    <input type="text" id="nombre">

    <label>Descripción *</label>
    <textarea id="descripcion" rows="4"></textarea>

    <label>Categoria *</label>
    <select id="categoria">
        <option value="">Selecciona una opción</option>
        <option value="Electronica">Electrónica</option>
        <option value="Accesorios">Accesorios</option>
        <option value="Ropa">Ropa</option>
        <option value="Otros">Otros</option>
    </select>

    <label>Lugar donde fue encontrado *</label>
    <input type="text" id="lugar">

    <label>Fecha encontrada *</label>
    <input type="date" id="fecha">

    <label>Fotografía (opcional)</label>
    <input type="file" id="imagen" accept="image/*">

    <button onclick="enviarFormulario()">Registrar</button>

    <div id="msg" class="msg"></div>
</div>


<script>
async function enviarFormulario(){
    let nombre = document.getElementById("nombre").value;
    let desc = document.getElementById("descripcion").value;
    let cat = document.getElementById("categoria").value;
    let lugar = document.getElementById("lugar").value;
    let fecha = document.getElementById("fecha").value;

    if(nombre=="" || desc=="" || cat=="" || lugar=="" || fecha==""){
        alert("Todos los campos marcados con * son obligatorios");
        return;
    }

    // Objeto a enviar
    let datos = {
        tipo: "encontrado",
        nombre: nombre,
        descripcion: desc,
        categoria: cat,
        lugar: lugar,
        fecha: fecha
    };

    try {
        const resp = await fetch("http://localhost:3000/api/guardar", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(datos)
        });

        const res = await resp.json();
        document.getElementById("msg").innerHTML = "✅ " + res.mensaje;

        // Limpiar formulario
        document.getElementById("nombre").value = "";
        document.getElementById("descripcion").value = "";
        document.getElementById("categoria").value = "";
        document.getElementById("lugar").value = "";
        document.getElementById("fecha").value = "";

    } catch(err) {
        console.error(err);
        document.getElementById("msg").innerHTML = "❌ Error al guardar";
    }
}
</script>


</body>
</html>
